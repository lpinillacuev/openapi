name: Persist Traffic Data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update-traffic:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Install dependencies
        run: pip install matplotlib

      - name: Update traffic data
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python .github/scripts/update_traffic.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graphs/traffic/views.json graphs/traffic/clones.json graphs/traffic/referrers.json graphs/traffic/popular_paths.json graphs/traffic/views.svg graphs/traffic/clones.svg graphs/traffic/referrers.svg graphs/traffic/popular_paths.svg graphs/traffic/index.html README.md
          git diff --staged --quiet || git commit -m "chore(traffic): update traffic data [skip ci]"
          git push

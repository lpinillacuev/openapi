# Pipeline configuration: Fury Spec Hub -> openapi-internal/spec3.yaml -> (publish-to-public) -> openapi/spec3.yaml
#
# tag:      matching tag name in spec3.yaml (groups paths by product)
# product:  product slug used by generated by-product specs
# paths:    public path prefixes owned by this product
# Note: fury_app names are internal and live in mercadopago/openapi-internal/apps.yaml.

apps:
  - tag: Payments
    product: payments
    paths:
      - /v1/payments

  - tag: Customers
    product: customers
    paths:
      - /v1/customers

  - tag: Preferences
    product: preferences
    paths:
      - /checkout/preferences

  - tag: Chargebacks
    product: chargebacks
    paths:
      - /v1/chargebacks

  - tag: Subscriptions
    product: subscriptions
    paths:
      - /preapproval
      - /preapproval_plan

  - tag: Merchant Orders
    product: merchant_orders
    paths:
      - /merchant_orders

  - tag: OAuth
    product: oauth
    paths:
      - /oauth/token

  - tag: Payment Methods
    product: payment_methods
    paths:
      - /v1/payment_methods

  - tag: Stores
    product: stores
    paths:
      - /users/

  - tag: POS
    product: pos
    paths:
      - /pos

  - tag: Orders
    product: orders
    paths:
      - /v1/orders

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traffic Dashboard — lpinillacuev/openapi</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f8fa; color: #24292f; padding: 24px; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #57606a; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 20px; }
    .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: #24292f; }
    canvas { max-height: 220px; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>lpinillacuev/openapi — Traffic Dashboard</h1>
  <p class="subtitle">Last updated: 2026-07-30 · Data persisted daily via GitHub Actions</p>
  <div class="grid">
    <div class="card"><h2>Page Views</h2><canvas id="views"></canvas></div>
    <div class="card"><h2>Git Clones</h2><canvas id="clones"></canvas></div>
    <div class="card"><h2>Referring Sites</h2><canvas id="referrers"></canvas></div>
    <div class="card"><h2>Popular Content</h2><canvas id="paths"></canvas></div>
  </div>
  <script>
    const views = {"2026-07-14": {"count": 306, "uniques": 3}, "2026-07-15": {"count": 99, "uniques": 2}, "2026-07-16": {"count": 69, "uniques": 3}, "2026-07-17": {"count": 0, "uniques": 0}, "2026-07-18": {"count": 0, "uniques": 0}, "2026-07-19": {"count": 0, "uniques": 0}, "2026-07-20": {"count": 0, "uniques": 0}, "2026-07-21": {"count": 43, "uniques": 3}, "2026-07-22": {"count": 217, "uniques": 3}, "2026-07-23": {"count": 1, "uniques": 1}, "2026-07-24": {"count": 2, "uniques": 1}, "2026-07-25": {"count": 1, "uniques": 1}, "2026-07-26": {"count": 0, "uniques": 0}, "2026-07-27": {"count": 0, "uniques": 0}, "2026-07-28": {"count": 14, "uniques": 2}, "2026-07-29": {"count": 57, "uniques": 2}};
    const clones = {"2026-07-14": {"count": 456, "uniques": 148}, "2026-07-15": {"count": 214, "uniques": 75}, "2026-07-16": {"count": 114, "uniques": 42}, "2026-07-17": {"count": 1, "uniques": 1}, "2026-07-18": {"count": 1, "uniques": 1}, "2026-07-19": {"count": 0, "uniques": 0}, "2026-07-20": {"count": 0, "uniques": 0}, "2026-07-21": {"count": 34, "uniques": 18}, "2026-07-22": {"count": 256, "uniques": 94}, "2026-07-23": {"count": 2, "uniques": 2}, "2026-07-24": {"count": 3, "uniques": 3}, "2026-07-25": {"count": 1, "uniques": 1}, "2026-07-26": {"count": 1, "uniques": 1}, "2026-07-27": {"count": 0, "uniques": 0}, "2026-07-28": {"count": 14, "uniques": 8}, "2026-07-29": {"count": 43, "uniques": 21}};
    const referrers = [{"referrer": "github.com", "count": 11, "uniques": 1}];
    const popularPaths = [{"path": "/lpinillacuev/openapi/pulls", "title": "/pulls", "count": 78, "uniques": 3}, {"path": "/lpinillacuev/openapi", "title": "Overview", "count": 58, "uniques": 2}, {"path": "/lpinillacuev/openapi/actions", "title": "/actions", "count": 36, "uniques": 2}, {"path": "/mercadopago/openapi/compare/main...lpinillacuev:openapi:main", "title": "compare/main...lpinillacuev:openapi:main", "count": 11, "uniques": 1}, {"path": "/lpinillacuev/openapi/compare/main...lpinillacuev:openapi:feat/bot-workflows", "title": "/compare/main...lpinillacuev:openapi:feat/bot-workflows", "count": 10, "uniques": 1}, {"path": "/lpinillacuev/openapi/compare/main...lpinillacuev:openapi:main", "title": "/compare/main...lpinillacuev:openapi:main", "count": 10, "uniques": 1}, {"path": "/lpinillacuev/openapi/pull/59", "title": "/pull/59", "count": 6, "uniques": 1}, {"path": "/lpinillacuev/openapi/pull/57", "title": "/pull/57", "count": 5, "uniques": 2}, {"path": "/lpinillacuev/openapi/actions/runs/29889946902", "title": "/actions/runs/29889946902", "count": 5, "uniques": 1}, {"path": "/lpinillacuev/openapi/blob/main/TRAFFIC.md", "title": "/blob/main/TRAFFIC.md", "count": 5, "uniques": 1}];

    const lineDefaults = {
      tension: 0.3, pointRadius: 2, pointHoverRadius: 5, fill: true,
    };

    function makeTimeSeries(data, colorTotal, colorUnique) {
      const labels = Object.keys(data);
      return {
        labels,
        datasets: [
          { ...lineDefaults, label: "Total", data: labels.map(d => data[d].count),
             borderColor: colorTotal, backgroundColor: colorTotal + "18" },
          { ...lineDefaults, label: "Unique", data: labels.map(d => data[d].uniques),
             borderColor: colorUnique, backgroundColor: colorUnique + "18", borderDash: [4,3] },
        ],
      };
    }

    const timeOpts = {
      responsive: true, interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { font: { size: 12 } } } },
      scales: {
        x: { type: "time", time: { unit: "day", displayFormats: { day: "MMM d" } },
              grid: { color: "#eaeef2" }, ticks: { font: { size: 11 } } },
        y: { grid: { color: "#eaeef2" }, ticks: { font: { size: 11 }, precision: 0 } },
      },
    };

    new Chart(document.getElementById("views"), { type: "line", data: makeTimeSeries(views, "#0969da", "#1a7f37"), options: timeOpts });
    new Chart(document.getElementById("clones"), { type: "line", data: makeTimeSeries(clones, "#8250df", "#bc4c00"), options: timeOpts });

    function makeBar(items, labelKey, color) {
      const top = items.slice(0, 8);
      return {
        labels: top.map(i => i[labelKey]),
        datasets: [
          { label: "Total", data: top.map(i => i.count), backgroundColor: color + "cc" },
          { label: "Unique", data: top.map(i => i.uniques), backgroundColor: color + "55" },
        ],
      };
    }

    const barOpts = {
      indexAxis: "y", responsive: true,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { font: { size: 12 } } } },
      scales: {
        x: { grid: { color: "#eaeef2" }, ticks: { font: { size: 11 }, precision: 0 } },
        y: { grid: { display: false }, ticks: { font: { size: 11 } } },
      },
    };

    new Chart(document.getElementById("referrers"), { type: "bar", data: makeBar(referrers, "referrer", "#0969da"), options: barOpts });
    new Chart(document.getElementById("paths"), { type: "bar", data: makeBar(popularPaths, "path", "#8250df"), options: barOpts });
  </script>
</body>
</html>
